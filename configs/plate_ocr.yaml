recognizer:
  engine_name: 'ppocr_mobile'
  device: 'cpu'
  min_confidence: 0.40

voting:
  min_crop_quality: 0.20
  min_support_count: 2
  cluster_distance_threshold: 0.35
  w_conf: 0.45
  w_qual: 0.25
  w_gram: 0.30
  consensus_threshold: 0.50

preprocessing:
  selected_variant: 'raw'
  target_height: 48
  max_width: 320
  two_line_aspect_threshold: 2.2

deduplication:
  enabled: true
  hash_dim: [16, 8]
