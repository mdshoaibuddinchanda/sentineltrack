timing:
  large_gap_seconds: 3600.0          # 1 hour gap triggers confidence penalty & warning
  low_quality_tolerance_seconds: 60.0 # Additional uncertainty margin when timing quality is LOW
  clock_skew_tolerance_seconds: 5.0   # Grace period for near-simultaneous observations

feasibility:
  urban_soft_speed_kmh: 90.0          # Soft threshold for urban roads
  highway_soft_speed_kmh: 140.0       # Soft threshold for highways / expressways
  hard_max_speed_kmh: 220.0           # Strict physics impossibility threshold (>220 km/h)
  dwell_speed_threshold_kmh: 5.0      # Speed below which motion is treated as stationary dwell

trajectory:
  min_match_score: 0.60               # Minimum P5 match score for route candidate inclusion
  investigation_mode: false           # If true, includes PROBABLE (0.50-0.70) matches
  max_candidate_sightings: 500        # Maximum sightings retrieved per route query
  max_alternative_paths: 3            # Top-K alternative trajectories tracked
  ambiguity_margin: 0.08              # Score difference below which secondary path triggers AMBIGUOUS
  collapse_same_camera_dwell: true    # If true, collapses consecutive stationary observations

spatial:
  default_nearby_radius_m: 5000.0     # Default 5km radius for nearby camera search
  max_nearby_radius_m: 50000.0        # Max 50km radius

confidence:
  identity_weight: 0.40               # P5 match score & multi-frame consensus
  timing_weight: 0.20                 # Time source & quality rating
  spatial_weight: 0.15                # Camera coordinate verification
  feasibility_weight: 0.15            # Physical speed reasonableness
  path_dominance_weight: 0.10         # Relative separation from alternative paths

geojson:
  decimal_precision: 6                # ~0.1m precision for WGS84 coordinates
