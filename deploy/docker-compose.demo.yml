services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: sentinel-postgres-demo
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-sentinel}
      POSTGRES_USER: ${DATABASE_USER:-sentinel}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - sentinel_postgres_demo:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-sentinel} -d ${DATABASE_NAME:-sentinel}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.api
    container_name: sentinel-api-demo
    restart: unless-stopped
    environment:
      SENTINEL_ENV: production
      SENTINEL_PROCESS_ROLE: api
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-sentinel}
      DATABASE_USER: ${DATABASE_USER:-sentinel}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      SENTINEL_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://127.0.0.1
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.frontend
    container_name: sentinel-frontend-demo
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  sentinel_postgres_demo:
