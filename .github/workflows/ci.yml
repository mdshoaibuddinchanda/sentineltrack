name: SentinelTrack CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests & Security Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Backend Pytest Suite
        run: |
          python -m pytest 10_security/tests/ 11_scale_deployment/tests/ -v

  frontend-test:
    name: Frontend Quality & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: 09_dashboard/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: 09_dashboard
        run: npm ci

      - name: TypeScript Typecheck
        working-directory: 09_dashboard
        run: npm run typecheck

      - name: ESLint Check
        working-directory: 09_dashboard
        run: npm run lint

      - name: Vitest Frontend Test Suite
        working-directory: 09_dashboard
        run: npx vitest run

      - name: Production Vite Build
        working-directory: 09_dashboard
        run: npm run build
