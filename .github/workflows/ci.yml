name: SentinelTrack CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: sentineltrack-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Security & Scale Backend Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: sentinel
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: sentinel
      DATABASE_USER: sentinel
      DATABASE_PASSWORD: sentinel_test_password
      SENTINEL_ENV: development
      SENTINEL_PROCESS_ROLE: api
      SENTINEL_REQUIRE_GPU: "false"
      SENTINEL_PG_EVENT_BRIDGE: "false"
      PYTHONPATH: .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt -c constraints-ci.txt

      - name: Initialize PostgreSQL Database Schemas
        run: |
          python tools/p11/init_schema.py

      - name: Run Security & Scale Pytest Suite
        run: |
          python -m pytest 10_security/tests/ 11_scale_deployment/tests/ tests/test_ci_contract.py -v --timeout=30




  frontend-test:
    name: Frontend Quality & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: 09_dashboard/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: 09_dashboard
        run: npm ci

      - name: TypeScript Typecheck
        working-directory: 09_dashboard
        run: npm run typecheck

      - name: ESLint Check
        working-directory: 09_dashboard
        run: npm run lint

      - name: Vitest Frontend Test Suite
        working-directory: 09_dashboard
        run: npx vitest run

      - name: Production Vite Build
        working-directory: 09_dashboard
        run: npm run build
